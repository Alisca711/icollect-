<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="我的藏品庫" />
  <title>我的藏品庫 | iCollect 個人版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-gray-900">

  <!-- 頂部導航與統計看板 -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-200 px-4 pt-3 pb-3">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-gray-900">我的藏品庫</h1>
        <p class="text-xs text-gray-500">Bandai 模型 & Tomica 車仔管理</p>
      </div>
      <div class="flex gap-2">
        <button onclick="openBackupModal()" class="p-2 rounded-full bg-gray-100 text-gray-700 active:bg-gray-200" title="備份與匯出">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        </button>
        <button onclick="openFormModal()" class="flex items-center gap-1 bg-blue-600 text-white px-3.5 py-2 rounded-full text-sm font-semibold shadow-sm active:bg-blue-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          新增
        </button>
      </div>
    </div>

    <!-- 4格數據摘要 -->
    <div class="grid grid-cols-4 gap-2 bg-gray-50 p-2.5 rounded-xl border border-gray-200/80 text-center">
      <div>
        <div class="text-[10px] text-gray-500 font-medium">總投入 (HKD)</div>
        <div id="stat-cost" class="text-sm font-bold text-gray-900 mt-0.5">$0</div>
      </div>
      <div>
        <div class="text-[10px] text-gray-500 font-medium">目前估值</div>
        <div id="stat-val" class="text-sm font-bold text-blue-600 mt-0.5">$0</div>
      </div>
      <div>
        <div class="text-[10px] text-gray-500 font-medium">整體損益</div>
        <div id="stat-pnl" class="text-sm font-bold text-emerald-600 mt-0.5">$0</div>
      </div>
      <div>
        <div class="text-[10px] text-gray-500 font-medium">總數量</div>
        <div id="stat-count" class="text-sm font-bold text-gray-900 mt-0.5">0</div>
      </div>
    </div>
  </header>

  <!-- 主頁面容器 -->
  <main id="view-collection" class="px-4 pt-3">
    <!-- 搜尋列與檢視切換 -->
    <div class="flex gap-2 mb-3">
      <div class="relative flex-1">
        <input id="search-input" type="text" oninput="renderItems()" placeholder="搜尋名稱、系列、備註、條碼、位置..." class="w-full pl-9 pr-3 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <button onclick="toggleViewMode()" id="btn-view-mode" class="p-2 bg-white border border-gray-200 rounded-xl text-gray-600 active:bg-gray-100" title="切換圖鑑/清單">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
      </button>
    </div>

    <!-- 分類膠囊篩選 -->
    <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-3">
      <button onclick="setCategory('ALL')" data-cat="ALL" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-white whitespace-nowrap">全部藏品</button>
      <button onclick="setCategory('玩具模型')" data-cat="玩具模型" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Bandai / 模型玩具</button>
      <button onclick="setCategory('Tomica車仔')" data-cat="Tomica車仔" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Tomica 車仔</button>
      <button onclick="setCategory('預訂中')" data-cat="預訂中" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">預訂中</button>
    </div>

    <!-- 藏品列表容器 -->
    <div id="items-container" class="grid grid-cols-2 gap-3"></div>
  </main>

  <!-- 擺放位置管理頁面 -->
  <main id="view-locations" class="px-4 pt-3 hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-bold text-gray-800">擺放位置一覽 & 容量管理</h2>
      <button onclick="openLocationModal()" class="text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg">+ 新增位置</button>
    </div>
    <div id="locations-container" class="space-y-3"></div>
  </main>

  <!-- 底部 Tab Bar -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-gray-200 flex justify-around py-2 z-30" style="padding-bottom: max(8px, env(safe-area-inset-bottom));">
    <button onclick="switchTab('collection')" id="tab-collection" class="flex flex-col items-center text-blue-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      <span class="text-[10px] font-semibold mt-0.5">藏品圖鑑</span>
    </button>
    <button onclick="switchTab('locations')" id="tab-locations" class="flex flex-col items-center text-gray-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      <span class="text-[10px] font-semibold mt-0.5">擺放位置</span>
    </button>
  </nav>

  <!-- 詳情檢視 Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5">
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- 新增 / 編輯藏品 Modal -->
  <div id="form-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 id="form-title" class="text-lg font-bold">新增藏品</h3>
        <button onclick="closeFormModal()" class="p-1.5 bg-gray-100 rounded-full text-gray-500">✕</button>
      </div>
      <form id="item-form" onsubmit="saveItem(event)" class="space-y-3 text-sm">
        <input type="hidden" id="f-id" />

        <!-- 相片上傳 -->
        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl border border-dashed border-gray-300">
          <img id="f-img-preview" src="" class="w-16 h-16 rounded-lg object-cover bg-gray-200 hidden" />
          <div class="flex-1">
            <label class="block font-semibold text-gray-700 mb-1">藏品相片（影相 / 相簿）</label>
            <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">大分類 *</label>
            <select id="f-category" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
              <option value="玩具模型">Bandai / 模型玩具</option>
              <option value="Tomica車仔">Tomica 車仔</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">個人入手狀況</label>
            <select id="f-status" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
              <option value="已入手">已入手</option>
              <option value="預訂中">預訂中</option>
              <option value="想買">想買</option>
              <option value="已出售">已出售</option>
            </select>
          </div>
        </div>

        <!-- 編號 / 名稱 + 掃描 Barcode -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-semibold text-gray-600">編號 / 名稱 *</label>
            <button type="button" onclick="startBarcodeScan()" class="text-xs text-blue-600 font-semibold bg-blue-50 px-2.5 py-1 rounded-lg flex items-center gap-1 active:bg-blue-100">
              <span>📷</span> 掃描 Barcode
            </button>
          </div>
          <input id="f-name" required type="text" placeholder="例如：S.H.Figuarts Kamen Rider Faiz" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />

          <!-- 掃描鏡頭預覽視窗 -->
          <div id="scanner-container" class="hidden mt-2 p-2 bg-black rounded-xl relative">
            <div id="reader" class="w-full overflow-hidden rounded-lg"></div>
            <button type="button" onclick="stopBarcodeScan()" class="absolute top-3 right-3 z-10 bg-white/90 text-black px-3 py-1 rounded-full text-xs font-bold shadow">關閉相機</button>
          </div>

          <!-- 掃描後出現嘅一鍵 Google 搜尋實體按鈕 (100% 唔會被 iOS Safari 阻擋) -->
          <div id="barcode-helper" class="hidden mt-2 flex items-center justify-between bg-blue-50 border border-blue-200 px-3 py-2 rounded-xl">
            <span id="barcode-status-text" class="text-xs text-blue-800 font-medium">已讀取條碼</span>
            <a id="barcode-google-link" href="#" target="_blank" rel="noopener noreferrer" class="text-xs bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm">
              🔍 Google 搜全名 ↗
            </a>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">品牌 / 系列</label>
            <input id="f-series" type="text" placeholder="例如：S.H.Figuarts / Premium" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">購買地區 / 版本</label>
            <select id="f-region" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
              <option value="日版">日版</option>
              <option value="港版">港版</option>
              <option value="行版">行版</option>
              <option value="海外版">海外版</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">實際入手價 (HKD)</label>
            <input id="f-cost" type="number" step="0.1" placeholder="0" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">二手估值 (HKD)</label>
            <input id="f-val" type="number" step="0.1" placeholder="0" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">官方定價</label>
            <input id="f-msrp" type="text" placeholder="¥5,500" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">盒況</label>
            <select id="f-box" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
              <option value="良好">良好</option>
              <option value="全新未開">全新未開</option>
              <option value="一般">一般</option>
              <option value="有損">有損</option>
              <option value="無盒">無盒</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">販售類型</label>
            <select id="f-saleType" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
              <option value="一般">一般</option>
              <option value="魂限">魂限</option>
              <option value="Premium">Premium</option>
              <option value="會場/限定">會場/限定</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">擺放位置</label>
            <input id="f-location" type="text" placeholder="如 A-1" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">官方發售日</label>
            <input id="f-releaseDate" type="text" placeholder="2027年2月" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">購入管道 / 渠道</label>
            <input id="f-channel" type="text" placeholder="P-Bandai / Mercari" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">參考網站 / 連結</label>
          <input id="f-url" type="url" placeholder="https://..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">附屬配件 / 備註</label>
          <textarea id="f-notes" rows="2" placeholder="再販、特價標籤、比例、條碼號碼等..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md active:bg-blue-700">儲存藏品資料</button>
      </form>
    </div>
  </div>

  <!-- 備份與匯出 Modal -->
  <div id="backup-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold">資料備份與同步</h3>
        <button onclick="document.getElementById('backup-modal').classList.add('hidden')" class="text-gray-400">✕</button>
      </div>
      <p class="text-xs text-gray-500">資料目前儲存在此 iPhone 本機。建議定期匯出備份或 CSV 同步回 Google Sheets。</p>
      <button onclick="exportCSV()" class="w-full py-2.5 bg-emerald-600 text-white text-sm font-semibold rounded-xl">匯出 Excel / Google Sheets (CSV)</button>
      <button onclick="exportJSON()" class="w-full py-2.5 bg-gray-900 text-white text-sm font-semibold rounded-xl">下載完整備份檔 (含相片 JSON)</button>
      <label class="block w-full py-2.5 bg-gray-100 text-gray-700 text-center text-sm font-semibold rounded-xl cursor-pointer">
        還原 JSON 備份檔
        <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
      </label>
    </div>
  </div>

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 600;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          tempBase64Image = canvas.toDataURL('image/jpeg', 0.75);
          const preview = document.getElementById('f-img-preview');
          preview.src = tempBase64Image;
          preview.classList.remove('hidden');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

      const headers = ['分類','名稱','系列','地區版本','盒況','擺放位置','二手估值','實際入手價','官方定價','官方發售日','販售類型','個人入手狀況','購入管道','備註'];
      const rows = items.map(i => [i.category, i.name, i.series, i.region, i.box, i.location, i.val, i.cost, i.msrp, i.releaseDate, i.saleType, i.status, i.channel, i.notes].map(v => `"${(v||'').toString().replace(/"/g, '""')}"`).join(','));
      const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `藏品管理備份_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

      };
      reader.readAsText(file);
    }

    // 掃描 Barcode 與自動透過日本 JAN 庫查詢 + 顯示防封鎖實體按鈕
    function startBarcodeScan() {
      const container = document.getElementById('scanner-container');
      const helper = document.getElementById('barcode-helper');
      container.classList.remove('hidden');
      helper.classList.add('hidden');
      
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 100 } },
        async (decodedText) => {
          stopBarcodeScan();
          const nameInput = document.getElementById('f-name');
          const seriesInput = document.getElementById('f-series');
          const catSelect = document.getElementById('f-category');
          const notesInput = document.getElementById('f-notes');
          const statusText = document.getElementById('barcode-status-text');
          const googleLink = document.getElementById('barcode-google-link');

          // 顯示 100% 唔會被 iOS 攔截嘅一鍵 Google 搜尋實體按鈕
          helper.classList.remove('hidden');
          statusText.textContent = `條碼: ${decodedText} (查詢中...)`;
          googleLink.href = `https://www.google.com/search?q=${encodeURIComponent(decodedText)}`;

          // 寫入備註並自動判斷品牌
          if (!notesInput.value.includes(decodedText)) {
            notesInput.value = `JAN: ${decodedText} ` + (notesInput.value || '');
          }
          if (decodedText.startsWith('4904810')) {
            catSelect.value = 'Tomica車仔';
            seriesInput.value = 'Takara Tomy / Tomica';
          } else if (decodedText.startsWith('4573102') || decodedText.startsWith('4549660')) {
            catSelect.value = '玩具模型';
            seriesInput.value = 'BANDAI SPIRITS';
          }

          nameInput.value = decodedText;

          // 嘗試跨域抓取日本 jancode.xyz 資料庫
          try {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.jancode.xyz/' + decodedText + '/')}`;
            const res = await fetch(proxyUrl);
            const json = await res.json();
            if (json && json.contents) {
              const doc = new DOMParser().parseFromString(json.contents, 'text/html');
              const titleEl = doc.querySelector('h1') || doc.querySelector('title');
              if (titleEl && titleEl.textContent) {
                let cleanTitle = titleEl.textContent.replace(/JANコード.*|【.*】/g, '').trim();
                if (cleanTitle && !cleanTitle.includes('404') && !cleanTitle.includes('見つかりません')) {
                  nameInput.value = cleanTitle;
                  statusText.textContent = `✅ 已自動填入日本資料庫名稱`;
                  return;
                }
              }
            }
          } catch (e) {}

          statusText.textContent = `未自動匹配，請撳右邊搜尋：`;
        },
        () => {}
      ).catch(() => {
        alert("無法開啟相機，請確保已允許 Safari 使用相機權限。");
        container.classList.add('hidden');
      });
    }

    function stopBarcodeScan() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('scanner-container').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scanner-container').classList.add('hidden');
        });
      } else {
        document.getElementById('scanner-container').classList.add('hidden');
      }
    }

    renderItems();
  </script>
</body>
</html>
