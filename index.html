<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="我的藏品庫" />
<title>我的藏品庫 | iCollect 極速版</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body {
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top);
  padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
  background-color: #f3f4f6;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="text-gray-900">

<!-- 頂部導航與統計看板 -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-200 px-4 pt-3 pb-3">
  <div class="flex items-center justify-between mb-3">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-gray-900">我的藏品庫</h1>
      <p class="text-xs text-gray-500">模型、車仔、Re-ment & 幪面超人專用</p>
    </div>
    <div class="flex gap-2">
      <button onclick="openBackupModal()" class="p-2 rounded-full bg-gray-100 text-gray-700 active:bg-gray-200" title="備份與匯出">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      </button>
      <button onclick="openFormModal()" class="flex items-center gap-1 bg-blue-600 text-white px-3.5 py-2 rounded-full text-sm font-semibold shadow-sm active:bg-blue-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        新增
      </button>
    </div>
  </div>

  <!-- 4格數據摘要 -->
  <div class="grid grid-cols-4 gap-2 bg-gray-50 p-2.5 rounded-xl border border-gray-200/80 text-center">
    <div>
      <div class="text-[10px] text-gray-500 font-medium">總投入 (HKD)</div>
      <div id="stat-cost" class="text-sm font-bold text-gray-900 mt-0.5">$0</div>
    </div>
    <div>
      <div class="text-[10px] text-gray-500 font-medium">目前估值</div>
      <div id="stat-val" class="text-sm font-bold text-blue-600 mt-0.5">$0</div>
    </div>
    <div>
      <div class="text-[10px] text-gray-500 font-medium">整體損益</div>
      <div id="stat-pnl" class="text-sm font-bold text-emerald-600 mt-0.5">$0</div>
    </div>
    <div>
      <div class="text-[10px] text-gray-500 font-medium">總數量</div>
      <div id="stat-count" class="text-sm font-bold text-gray-900 mt-0.5">0</div>
    </div>
  </div>
</header>

<!-- 主頁面容器 -->
<main id="view-collection" class="px-4 pt-3">
  <!-- 搜尋列與檢視切換 -->
  <div class="flex gap-2 mb-3">
    <div class="relative flex-1">
      <input id="search-input" type="text" oninput="renderItems()" placeholder="搜尋名稱、系列、備註、條碼、位置..." class="w-full pl-9 pr-3 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>
    <button onclick="toggleViewMode()" id="btn-view-mode" class="p-2 bg-white border border-gray-200 rounded-xl text-gray-600 active:bg-gray-100" title="切換圖鑑/清單">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
    </button>
  </div>

  <!-- 一級分類膠囊篩選 -->
  <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
    <button onclick="setCategory('ALL')" data-cat="ALL" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-900 text-white whitespace-nowrap">全部藏品</button>
    <button onclick="setCategory('玩具模型')" data-cat="玩具模型" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">玩具模型</button>
    <button onclick="setCategory('Tomica車仔')" data-cat="Tomica車仔" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Tomica車仔</button>
    <button onclick="setCategory('Re-ment')" data-cat="Re-ment" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">Re-ment</button>
    <button onclick="setCategory('幪面超人')" data-cat="幪面超人" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">幪面超人</button>
    <button onclick="setCategory('預訂中')" data-cat="預訂中" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 whitespace-nowrap">預訂中</button>
  </div>

  <!-- 二級系列過濾膠囊 -->
  <div class="flex gap-1.5 overflow-x-auto hide-scrollbar pb-3">
    <button onclick="setSeriesFilter('ALL')" data-series="ALL" class="series-pill px-3 py-1 rounded-full text-[11px] font-medium bg-blue-600 text-white whitespace-nowrap">全系列</button>
    <button onclick="setSeriesFilter('Premium')" data-series="Premium" class="series-pill px-3 py-1 rounded-full text-[11px] font-medium bg-white text-gray-500 border border-gray-200 whitespace-nowrap">Tomica Premium</button>
    <button onclick="setSeriesFilter('Dream Tomica')" data-series="Dream Tomica" class="series-pill px-3 py-1 rounded-full text-[11px] font-medium bg-white text-gray-500 border border-gray-200 whitespace-nowrap">Dream Tomica</button>
    <button onclick="setSeriesFilter('普通車')" data-series="普通車" class="series-pill px-3 py-1 rounded-full text-[11px] font-medium bg-white text-gray-500 border border-gray-200 whitespace-nowrap">普通紅盒車</button>
    <button onclick="setSeriesFilter('真骨彫製法')" data-series="真骨彫製法" class="series-pill px-3 py-1 rounded-full text-[11px] font-medium bg-white text-gray-500 border border-gray-200 whitespace-nowrap">真骨彫製法</button>
  </div>

  <!-- 藏品列表容器 -->
  <div id="items-container" class="grid grid-cols-2 gap-3"></div>
</main>

<!-- 擺放位置管理頁面 -->
<main id="view-locations" class="px-4 pt-3 hidden">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-base font-bold text-gray-800">擺放位置一覽 & 容量管理</h2>
    <button onclick="openLocationModal()" class="text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg">+ 新增位置</button>
  </div>
  <div id="locations-container" class="space-y-3"></div>
</main>

<!-- 底部 Tab Bar -->
<nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-gray-200 flex justify-around py-2 z-30" style="padding-bottom: max(8px, env(safe-area-inset-bottom));">
  <button onclick="switchTab('collection')" id="tab-collection" class="flex flex-col items-center text-blue-600">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
    <span class="text-[10px] font-semibold mt-0.5">藏品圖鑑</span>
  </button>
  <button onclick="switchTab('locations')" id="tab-locations" class="flex flex-col items-center text-gray-400">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
    <span class="text-[10px] font-semibold mt-0.5">擺放位置</span>
  </button>
</nav>

<!-- 詳情檢視 Modal -->
<div id="detail-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-end sm:items-center justify-center">
  <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5">
    <div id="detail-content"></div>
  </div>
</div>

<!-- 新增 / 編輯藏品 Modal -->
<div id="form-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-end sm:items-center justify-center">
  <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5">
    <div class="flex justify-between items-center mb-3">
      <h3 id="form-title" class="text-base font-bold">新增藏品</h3>
      <button onclick="closeFormModal()" class="p-1.5 bg-gray-100 rounded-full text-gray-500">✕</button>
    </div>

    <form id="item-form" onsubmit="saveItem(event, false)" class="space-y-3 text-sm">
      <input type="hidden" id="f-id" />

      <!-- 相片上傳 + 預覽 + 系統分享 Google Lens -->
      <div class="bg-gray-50 p-3 rounded-xl border border-dashed border-gray-300">
        <div class="flex items-start gap-3">
          <img id="f-img-preview" src="" class="w-20 h-20 rounded-lg object-cover bg-gray-200 hidden shrink-0" />
          <div class="flex-1 min-w-0">
            <label class="block font-semibold text-gray-700 text-xs mb-1">藏品相片</label>
            <input id="f-img-input" type="file" accept="image/*" onchange="handleImageUpload(event)" class="text-xs text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700" />
            
            <!-- 圖片操作按鈕（有圖先顯示） -->
            <div id="image-actions" class="hidden mt-2.5 flex flex-wrap gap-2">
              <button type="button" onclick="searchWithGoogleLens()" class="text-xs font-semibold bg-indigo-600 text-white px-3 py-1.5 rounded-lg active:bg-indigo-700 flex items-center gap-1">
                🔍 Google 識圖 / 分享
              </button>
              <button type="button" onclick="pasteNameFromClipboard()" class="text-xs font-semibold bg-emerald-600 text-white px-3 py-1.5 rounded-lg active:bg-emerald-700 flex items-center gap-1">
                📋 貼上名稱
              </button>
            </div>
          </div>
        </div>
        <p id="lens-tip" class="hidden text-[11px] text-gray-600 bg-indigo-50/70 p-2 rounded-lg mt-2 leading-relaxed"></p>
      </div>

      <!-- 大分類快速點選膠囊 -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">大分類 *</label>
        <div class="grid grid-cols-4 gap-1.5" id="category-chips">
          <button type="button" onclick="selectChip('category', '玩具模型', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">玩具模型</button>
          <button type="button" onclick="selectChip('category', 'Tomica車仔', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">Tomica</button>
          <button type="button" onclick="selectChip('category', 'Re-ment', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">Re-ment</button>
          <button type="button" onclick="selectChip('category', '幪面超人', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">幪面超人</button>
        </div>
        <input type="hidden" id="f-category" value="玩具模型" />
      </div>

      <!-- 個人入手狀況 -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">入手狀況</label>
        <div class="grid grid-cols-4 gap-1.5" id="status-chips">
          <button type="button" onclick="selectChip('status', '已入手', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">已入手</button>
          <button type="button" onclick="selectChip('status', '預訂中', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">預訂中</button>
          <button type="button" onclick="selectChip('status', '想買', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">想買</button>
          <button type="button" onclick="selectChip('status', '已出售', this)" class="py-1.5 px-2 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">已出售</button>
        </div>
        <input type="hidden" id="f-status" value="已入手" />
      </div>

      <!-- 名稱 / 掃描 Barcode -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-gray-600">編號 / 名稱 *</label>
          <button type="button" onclick="startBarcodeScan()" class="text-xs text-blue-600 font-semibold bg-blue-50 px-2.5 py-1 rounded-lg flex items-center gap-1">
            <span>📷</span> 掃描 Barcode
          </button>
        </div>
        <input id="f-name" required type="text" placeholder="例如：S.H.Figuarts 真骨彫 幪面超人..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />

        <div id="scanner-container" class="hidden mt-2 p-2 bg-black rounded-xl relative">
          <div id="reader" class="w-full overflow-hidden rounded-lg"></div>
          <button type="button" onclick="stopBarcodeScan()" class="absolute top-3 right-3 z-10 bg-white/90 text-black px-3 py-1 rounded-full text-xs font-bold shadow">關閉相機</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">品牌 / 系列</label>
          <input id="f-series" type="text" placeholder="真骨彫製法 / Premium" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          <!-- 常見系列快捷鍵 -->
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            <button type="button" onclick="quickFillSeries('Premium')" class="text-[11px] px-2 py-1 rounded-md bg-blue-50 text-blue-700 font-medium">Premium</button>
            <button type="button" onclick="quickFillSeries('Dream Tomica')" class="text-[11px] px-2 py-1 rounded-md bg-blue-50 text-blue-700 font-medium">Dream Tomica</button>
            <button type="button" onclick="quickFillSeries('普通紅盒')" class="text-[11px] px-2 py-1 rounded-md bg-blue-50 text-blue-700 font-medium">普通紅盒</button>
            <button type="button" onclick="quickFillSeries('真骨彫製法')" class="text-[11px] px-2 py-1 rounded-md bg-blue-50 text-blue-700 font-medium">真骨彫</button>
            <button type="button" onclick="quickFillSeries('S.H.Figuarts')" class="text-[11px] px-2 py-1 rounded-md bg-blue-50 text-blue-700 font-medium">SHF</button>
            <button type="button" onclick="quickFillSeries('Re-ment')" class="text-[11px] px-2 py-1 rounded-md bg-blue-50 text-blue-700 font-medium">Re-ment</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">版本</label>
          <div class="grid grid-cols-2 gap-1" id="region-chips">
            <button type="button" onclick="selectChip('region', '日版', this)" class="py-2 px-1 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">日版</button>
            <button type="button" onclick="selectChip('region', '港行版', this)" class="py-2 px-1 text-xs font-bold rounded-lg border border-gray-200 bg-gray-50 text-gray-700">港行版</button>
          </div>
          <input type="hidden" id="f-region" value="日版" />
        </div>
      </div>

      <!-- 價錢快速點選 -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">實際入手價 (HKD)</label>
          <input id="f-cost" type="number" step="0.1" placeholder="0" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
        <!-- 價錢快速點選（全品類綜合階梯版） -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">實際入手價 (HKD)</label>
          <input id="f-cost" type="number" step="0.1" placeholder="0" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
        <!-- 價錢快速點選（全品類綜合階梯版） -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">實際入手價 (HKD)</label>
          <input id="f-cost" type="number" step="0.1" placeholder="0" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          <div class="grid grid-cols-5 gap-1 mt-1.5">
            <button type="button" onclick="document.getElementById('f-cost').value='15'" class="text-[11px] font-bold bg-gray-100 hover:bg-gray-200 py-1 rounded text-gray-700">$15</button>
            <button type="button" onclick="document.getElementById('f-cost').value='38'" class="text-[11px] font-bold bg-gray-100 hover:bg-gray-200 py-1 rounded text-gray-700">$38</button>
            <button type="button" onclick="document.getElementById('f-cost').value='65'" class="text-[11px] font-bold bg-gray-100 hover:bg-gray-200 py-1 rounded text-gray-700">$65</button>
            <button type="button" onclick="document.getElementById('f-cost').value='350'" class="text-[11px] font-bold bg-gray-100 hover:bg-gray-200 py-1 rounded text-gray-700">$350</button>
            <button type="button" onclick="document.getElementById('f-cost').value='550'" class="text-[11px] font-bold bg-gray-100 hover:bg-gray-200 py-1 rounded text-gray-700">$550</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">二手估值 (HKD)</label>
          <input id="f-val" type="number" step="0.1" placeholder="0" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
          <div class="grid grid-cols-5 gap-1 mt-1.5">
            <button type="button" onclick="document.getElementById('f-val').value='30'" class="text-[11px] font-bold bg-blue-50 hover:bg-blue-100 py-1 rounded text-blue-700">$30</button>
            <button type="button" onclick="document.getElementById('f-val').value='50'" class="text-[11px] font-bold bg-blue-50 hover:bg-blue-100 py-1 rounded text-blue-700">$50</button>
            <button type="button" onclick="document.getElementById('f-val').value='85'" class="text-[11px] font-bold bg-blue-50 hover:bg-blue-100 py-1 rounded text-blue-700">$85</button>
            <button type="button" onclick="document.getElementById('f-val').value='450'" class="text-[11px] font-bold bg-blue-50 hover:bg-blue-100 py-1 rounded text-blue-700">$450</button>
            <button type="button" onclick="document.getElementById('f-val').value='900'" class="text-[11px] font-bold bg-blue-50 hover:bg-blue-100 py-1 rounded text-blue-700">$900</button>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">盒況</label>
          <select id="f-box" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
            <option value="良好">良好</option>
            <option value="全新未開">全新未開</option>
            <option value="有損">有損</option>
            <option value="無盒">無盒</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">販售類型</label>
          <select id="f-saleType" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
            <option value="一般">一般</option>
            <option value="魂限">魂限</option>
            <option value="Premium">Premium</option>
            <option value="會場限定">會場限定</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">擺放位置</label>
          <input id="f-location" type="text" placeholder="如 A-1" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">官方發售日</label>
          <input id="f-releaseDate" type="text" placeholder="2027年2月" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl" />
        </div>

// 圖片上傳並壓縮（減省 localStorage 容量）
function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      tempBase64Image = canvas.toDataURL('image/jpeg', 0.8);

      const preview = document.getElementById('f-img-preview');
      preview.src = tempBase64Image;
      preview.classList.remove('hidden');
      document.getElementById('image-actions').classList.remove('hidden');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 將 Base64 轉為 File 物件，供系統分享選單使用
function base64ToFile(base64Data, filename) {
  const arr = base64Data.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) {
    u8arr[n] = bstr.charCodeAt(n);
  }
  return new File([u8arr], filename, { type: mime });
}

// 撳掣後直接用系統分享圖片去 Google App / Lens
async function searchWithGoogleLens() {
  if (!tempBase64Image) {
    alert('請先選擇或拍攝相片');
    return;
  }

  const tip = document.getElementById('lens-tip');

  try {
    const file = base64ToFile(tempBase64Image, 'collect_item.jpg');

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: '搜尋藏品資料'
      });

      tip.classList.remove('hidden');
      tip.innerHTML = `
        <b>系統分享操作提示：</b><br>
        1. 喺分享選單揀 <b>「Google」</b> 或 <b>「使用 Google 搜尋圖片」</b><br>
        2. 搵到正確產品後，長按產品名稱 → <b>拷貝</b><br>
        3. 返嚟呢度撳綠色 <b>「📋 貼上名稱」</b>
      `;
      return;
    }
  } catch (err) {
    if (err.name === 'AbortError') return;
    console.warn('系統分享失敗，改用網頁版開啟:', err);
  }

  // Fallback：不支援檔案分享時改開網頁版 Google Lens
  window.open('https://lens.google.com/upload', '_blank');
  tip.classList.remove('hidden');
  tip.innerHTML = `
    已開啟網頁版 Google Lens。<br>
    1. 撳「上傳圖片」並選擇相片<br>
    2. 搵到正確產品後，長按名稱 → 拷貝<br>
    3. 返嚟呢度撳綠色 <b>「📋 貼上名稱」</b>
  `;
}

// 相機條碼掃描
function startBarcodeScan() {
  const container = document.getElementById('scanner-container');
  container.classList.remove('hidden');
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 120 } },
    (decodedText) => {
      const nameInput = document.getElementById('f-name');
      nameInput.value = nameInput.value ? `${nameInput.value} [${decodedText}]` : decodedText;
      if (navigator.vibrate) navigator.vibrate(40);
      stopBarcodeScan();
    },
    () => {}
  ).catch(err => {
    alert('無法開啟相機掃描：' + err);
    container.classList.add('hidden');
  });
}

function stopBarcodeScan() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      html5QrCode = null;
    }).catch(() => {});
  }
  document.getElementById('scanner-container').classList.add('hidden');
}

function renderItems() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = items.filter(item => {
    const matchCat = currentCategory === 'ALL' || item.category === currentCategory || item.status === currentCategory;
    const matchSeries = currentSeries === 'ALL' || (item.series && item.series.toLowerCase().includes(currentSeries.toLowerCase()));
    const matchQuery = !q || [item.name, item.series, item.notes, item.location, item.channel].some(f => (f || '').toLowerCase().includes(q));
    return matchCat && matchSeries && matchQuery;
  });

  const totalCost = filtered.reduce((sum, i) => sum + (Number(i.cost) || 0), 0);
  const totalVal = filtered.reduce((sum, i) => sum + (Number(i.val) || 0), 0);
  const pnl = totalVal - totalCost;

  document.getElementById('stat-cost').textContent = '$' + totalCost.toLocaleString();
  document.getElementById('stat-val').textContent = '$' + totalVal.toLocaleString();
  const pnlEl = document.getElementById('stat-pnl');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toLocaleString();
  pnlEl.className = 'text-sm font-bold mt-0.5 ' + (pnl >= 0 ? 'text-emerald-600' : 'text-rose-600');

    return;

  container.innerHTML = filtered.map(item => {
    const badgeColor = item.status === '預訂中' ? 'bg-amber-100 text-amber-800' : item.status === '想買' ? 'bg-sky-100 text-sky-800' : item.status === '已出售' ? 'bg-gray-200 text-gray-600' : 'bg-emerald-100 text-emerald-800';

          <span class="text-[10px] mt-1 line-clamp-1">${item.region || '日版'}</span>

    if (isGridView) {
      return `
        <div onclick="openDetail('${item.id}')" class="bg-white rounded-2xl overflow-hidden border border-gray-200/80 shadow-sm active:scale-[0.98] transition-transform flex flex-col">
          <div class="relative">
            ${imgHtml}
            <span class="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${item.status || '已入手'}</span>
            ${item.saleType && item.saleType !== '一般' ? `<span class="absolute top-2 right-2 text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-600 text-white">${item.saleType}</span>` : ''}
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>

              <h3 class="text-xs font-bold text-gray-900 line-clamp-2 mt-0.5 leading-snug">${item.name}</h3>
            </div>
            <div class="mt-2.5 pt-2 border-t border-gray-100 flex items-center justify-between text-[11px]">
              <span class="text-gray-500">入手 <b class="text-gray-800">$${item.cost || 0}</b></span>
              <span class="text-blue-600 font-semibold">估 $${item.val || 0}</span>
            </div>
          </div>

    } else {
      return `

  document.getElementById('detail-modal').classList.add('hidden');

  document.getElementById('form-title').textContent = '編輯藏品';
  document.getElementById('f-id').value = item.id;
  document.getElementById('f-name').value = item.name || '';
  document.getElementById('f-series').value = item.series || '';
  document.getElementById('f-cost').value = item.cost || '';
  document.getElementById('f-val').value = item.val || '';
  document.getElementById('f-box').value = item.box || '良好';
  document.getElementById('f-saleType').value = item.saleType || '一般';
  document.getElementById('f-location').value = item.location || '';
  document.getElementById('f-releaseDate').value = item.releaseDate || '';
  document.getElementById('f-channel').value = item.channel || '';
  document.getElementById('f-notes').value = item.notes || '';

  // 同步膠囊狀態
  ['category', 'status', 'region'].forEach(type => {
    const targetVal = item[type];
    const btns = document.querySelectorAll(`#${type}-chips button`);
    btns.forEach(btn => {
      if (btn.textContent.includes(targetVal) || (targetVal === 'Tomica車仔' && btn.textContent === 'Tomica')) {
        selectChip(type, targetVal, btn);
      }
    });
  });

  if (item.image) {
    tempBase64Image = item.image;
    const preview = document.getElementById('f-img-preview');
    preview.src = item.image;
    preview.classList.remove('hidden');
    document.getElementById('image-actions').classList.remove('hidden');
  } else {
    tempBase64Image = '';
    document.getElementById('f-img-preview').classList.add('hidden');
    document.getElementById('image-actions').classList.add('hidden');
  }
}

function saveItem(event, keepOpen = false) {
  if (event) event.preventDefault();
  const nameVal = document.getElementById('f-name').value.trim();
  if (!nameVal) {
    alert('請輸入藏品編號或名稱');
    return;
  }

  const existingId = document.getElementById('f-id').value;
  const itemData = {
    id: existingId || 'item_' + Date.now(),
    category: document.getElementById('f-category').value,
    status: document.getElementById('f-status').value,
    name: nameVal,
    series: document.getElementById('f-series').value.trim(),
    region: document.getElementById('f-region').value,
    cost: Number(document.getElementById('f-cost').value) || 0,
    val: Number(document.getElementById('f-val').value) || 0,
    box: document.getElementById('f-box').value,
    saleType: document.getElementById('f-saleType').value,
    location: document.getElementById('f-location').value.trim(),
    releaseDate: document.getElementById('f-releaseDate').value.trim(),
    channel: document.getElementById('f-channel').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    image: tempBase64Image,
    updatedAt: new Date().toISOString()
  };

  if (existingId) {
    const idx = items.findIndex(i => i.id === existingId);
    if (idx !== -1) items[idx] = itemData;
  } else {
    items.unshift(itemData);
  }

  saveToStorage();
  renderItems();

  if (keepOpen) {
    // 保留分類與系列設定，清空名稱、價錢、相片以便快速錄入下一件
    document.getElementById('f-id').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-notes').value = '';
    tempBase64Image = '';
    document.getElementById('f-img-input').value = '';
    document.getElementById('f-img-preview').classList.add('hidden');
    document.getElementById('image-actions').classList.add('hidden');
    document.getElementById('lens-tip').classList.add('hidden');
    if (navigator.vibrate) navigator.vibrate(30);
  } else {
    closeFormModal();
  }
}

function deleteItem(id) {
  if (!confirm('確定要刪除呢件藏品嗎？')) return;
  items = items.filter(i => i.id !== id);
  saveToStorage();
  document.getElementById('detail-modal').classList.add('hidden');
  renderItems();
}

// 擺放位置管理
function renderLocations() {
  const container = document.getElementById('locations-container');
  container.innerHTML = locations.map((loc, idx) => {
    const count = items.filter(i => (i.location || '').toLowerCase() === loc.code.toLowerCase()).length;
    const max = Number(loc.max) || 20;
    const pct = Math.min(100, Math.round((count / max) * 100));
    return `
      <div class="bg-white p-3.5 rounded-2xl border border-gray-200/80 shadow-sm">
        <div class="flex justify-between items-start">
          <div>
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-700">${loc.code}</span>
            <span class="text-sm font-bold text-gray-900 ml-1.5">${loc.desc}</span>
            <p class="text-[11px] text-gray-500 mt-1">${loc.type || '一般收納'} ${loc.note ? '· ' + loc.note : ''}</p>
          </div>
          <button onclick="deleteLocation(${idx})" class="text-xs text-gray-400 hover:text-rose-500">刪除</button>
        </div>
        <div class="mt-3">
          <div class="flex justify-between text-[11px] mb-1">
            <span class="text-gray-500">已存放數量</span>
            <span class="font-bold ${pct >= 90 ? 'text-rose-600' : 'text-gray-800'}">${count} / ${max} 件 (${pct}%)</span>
          </div>
          <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full ${pct >= 90 ? 'bg-rose-500' : 'bg-blue-600'} rounded-full" style="width: ${pct}%"></div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function openLocationModal() {
  document.getElementById('location-modal').classList.remove('hidden');
}

function saveLocation(event) {
  event.preventDefault();
  locations.push({
    code: document.getElementById('l-code').value.trim(),
    desc: document.getElementById('l-desc').value.trim(),
    type: document.getElementById('l-type').value.trim(),
    max: Number(document.getElementById('l-max').value) || 20,
    note: document.getElementById('l-note').value.trim()
  });
  saveToStorage();
  document.getElementById('location-modal').classList.add('hidden');
  event.target.reset();
  renderLocations();
}

function deleteLocation(idx) {
  if (!confirm('確定刪除此擺放位置？')) return;
  locations.splice(idx, 1);
  saveToStorage();
  renderLocations();
}

// 備份與匯出 / 匯入
function openBackupModal() {
  document.getElementById('backup-modal').classList.remove('hidden');
}

function exportJSON() {
  const payload = { exportedAt: new Date().toISOString(), items, locations };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `icollect_backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        items = data;
      } else if (data.items) {
        items = data.items;
        if (data.locations) locations = data.locations;
      } else {
        throw new Error('格式不符');
      }
      saveToStorage();
      renderItems();
      document.getElementById('backup-modal').classList.add('hidden');
      alert(`成功匯入 ${items.length} 件藏品資料！`);
    } catch (err) {
      alert('JSON 檔案格式錯誤：' + err.message);
    }
  };
  reader.readAsText(file);
}

// 初始化渲染
initChips();
renderItems();
</script>
</body>
</html>
